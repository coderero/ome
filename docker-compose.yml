name: ome

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ome
      POSTGRES_PASSWORD: ome
      POSTGRES_DB: ome
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ome-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ome -d ome"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ome-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ome-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  ome-postgres:
  ome-redis:
  ome-ollama:
