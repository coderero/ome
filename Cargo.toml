[workspace]
resolver = "3"
members = ["crates/ome-*", "crates/ui/ome-*", "crates/ui/apps/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ome-core = { path = "crates/ome-core" }
ome-protocol = { path = "crates/ome-protocol" }
ome-client = { path = "crates/ome-client" }
ome-store = { path = "crates/ome-store" }
ome-net = { path = "crates/ome-net" }
ome-exchange = { path = "crates/ome-exchange" }
ome-broker = { path = "crates/ome-broker" }
ome-ui-data = { path = "crates/ui/ome-ui-data" }
ome-ui = { path = "crates/ui/ome-ui" }
rand = "0.9"
sha2 = "0.10"
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "persistence"] }
egui = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
serde = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
inconsistent_digit_grouping = "allow"
