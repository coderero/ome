[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ome-core = { path = "crates/ome-core" }
ome-protocol = { path = "crates/ome-protocol" }
ome-client = { path = "crates/ome-client" }
rand = "0.9"
ratatui = "0.29"
sha2 = "0.10"

[workspace.lints.clippy]
inconsistent_digit_grouping = "allow"
