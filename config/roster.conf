# Firm roster for ome-agents. Every agent reaches the market only through its broker.
# group <name> count=N broker=<provider> role=<role> strategy=<strategy> [symbols=A,B|*] [cash=AMOUNT]
#       [seed=AMOUNT of starting inventory per symbol, bought with real orders] [strategy params]

# Tier 1 HFT (DMA): Avellaneda-Stoikov market making, two firms with different risk aversion
group hft-vega   count=1  broker=dma-co    role=hft    strategy=market-maker cash=600000  seed=60000  gamma=0.3 spread_bps=14
group hft-delta  count=1  broker=dma-co    role=hft    strategy=market-maker cash=600000  seed=60000  gamma=0.8 spread_bps=22

# Liquidity providers: the designated market maker desk, quoting round lots within the obligation
group dmm-desk   count=2  broker=lp-co     role=lp     strategy=dmm          cash=400000  seed=50000

# Tier 1 quant funds (prime): pairs stat-arb through broker algos or the dark pool, factor model through VWAP
group pairs-pov  count=1  broker=prime-co  role=quant  strategy=pairs symbols=ACME,NOVA cash=500000 seed=100000 exec=algo
group pairs-dark count=1  broker=prime-co  role=quant  strategy=pairs symbols=NOVA,ZEN  cash=500000 seed=100000 exec=dark
group factor     count=2  broker=prime-co  role=quant  strategy=factor       cash=300000  seed=100000
# event-driven funds: trade fresh newsroom stories by tone and fair value impact, unwind after a minute
group news-fund  count=2  broker=prime-co  role=quant  strategy=news         cash=400000  seed=100000

# Tier 1 slow money (prime): pension funds rebalancing with slow VWAP parents
group pension    count=2  broker=prime-co  role=quant  strategy=pension      cash=500000  seed=150000

# Value investors: trade around fair value (set by ome-simctl, default the listing price); they anchor prices
group value-fund count=2  broker=prime-co  role=quant  strategy=value        cash=600000  seed=200000
group value-ret  count=5  broker=retail-co role=retail strategy=value        cash=30000   seed=8000  band_bps=250

# Tier 2 prop desks (prime): entries protected by OCO take-profit/stop exits
group prop-mom   count=3  broker=prime-co  role=prop   strategy=momentum     cash=300000
group prop-brk   count=2  broker=prime-co  role=prop   strategy=breakout     cash=300000
group prop-rev   count=3  broker=prime-co  role=prop   strategy=meanrev      cash=300000

# Tier 3 retail (retail broker): rule-based personas using stops, brackets, GTT and after-market orders
group daytrader  count=10 broker=retail-co role=retail strategy=daytrader    cash=25000
group swing      count=10 broker=retail-co role=retail strategy=swing        cash=40000
group investor   count=8  broker=retail-co role=retail strategy=investor     cash=60000
# ML personas: online logistic regression on returns, volatility, z-score and news sentiment; they learn
# from the tape before trading, then enter with brackets or GTT dips and exit when the model turns
group ml-cautious count=4 broker=retail-co role=retail strategy=ml-retail    cash=40000   style=cautious
group ml-bold    count=4  broker=retail-co role=retail strategy=ml-retail    cash=40000   style=bold
group noise      count=15 broker=retail-co role=retail strategy=noise        cash=20000   seed=4000
