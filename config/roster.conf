# Firm roster, owned by ome-simctl: it opens each agent's account at its broker and assigns the agents
# to the connected ome-agents runners. Every agent reaches the market only through its broker.
# group <name> count=N broker=<provider> role=<role> strategy=<strategy> [symbols=A,B|*] [cash=AMOUNT]
#       [seed=AMOUNT of starting inventory per symbol, bought with real orders; with seed_by=cap it is the
#       total, split by free-float market cap] [inflow_bps=household savings per trading day] [strategy params]

# Long-term institutions: they hold most of the free float and trade slowly
# index funds: free-float market-cap weights, rebalanced with limit orders in the closing auction
group index-fund  count=2  broker=prime-co  role=quant  strategy=index        cash=8000000  seed=7600000 seed_by=cap
# domestic mutual funds (DII): savers add money every day; they buy below their valuation and trim far above it
group dii-fund    count=3  broker=prime-co  role=quant  strategy=mutual       cash=3000000  seed=2600000 seed_by=cap inflow_bps=8
# foreign funds (FII): exposure follows global risk appetite read from macro news, executed with VWAP parents
group fii-fund    count=2  broker=prime-co  role=quant  strategy=fii          cash=5000000  seed=2800000 seed_by=cap
# sovereign fund: deep pockets, buys only big discounts to its valuation
group sovereign   count=1  broker=prime-co  role=quant  strategy=sovereign    cash=10000000
# pension funds: equal weights, slow VWAP rebalancing
group pension     count=2  broker=prime-co  role=quant  strategy=pension      cash=3000000  seed=800000

# Liquidity: HFT desks (Avellaneda-Stoikov) and the designated market maker desk, each quoting several levels
group hft-vega    count=1  broker=dma-co    role=hft    strategy=market-maker cash=3000000  seed=300000  gamma=0.3 spread_bps=14 levels=3
group hft-delta   count=1  broker=dma-co    role=hft    strategy=market-maker cash=3000000  seed=300000  gamma=0.8 spread_bps=22 levels=3
group dmm-desk    count=2  broker=lp-co     role=lp     strategy=dmm          cash=2500000  seed=250000  levels=4

# Quant funds (prime): pairs stat-arb through broker algos or the dark pool, factor model through VWAP
group pairs-pov   count=1  broker=prime-co  role=quant  strategy=pairs symbols=ACME,NOVA cash=2500000 seed=500000 exec=algo
group pairs-dark  count=1  broker=prime-co  role=quant  strategy=pairs symbols=NOVA,ZEN  cash=2500000 seed=500000 exec=dark
group factor      count=2  broker=prime-co  role=quant  strategy=factor       cash=1500000  seed=500000
# event-driven funds: trade fresh stories by tone and value impact, unwind after a minute
group news-fund   count=2  broker=prime-co  role=quant  strategy=news         cash=2000000  seed=400000

# Value investors: each values the companies itself from the news (prospectus, earnings, events) with its own bias and
# reading lag, and rests bids below and offers above that value; disagreement and order flow set the price
group value-fund  count=2  broker=prime-co  role=quant  strategy=value        cash=6000000  seed=1000000
group value-ret   count=5  broker=retail-co role=retail strategy=value        cash=60000    seed=10000  band_bps=250

# Prop desks (prime): entries protected by OCO take-profit/stop exits
group prop-mom    count=3  broker=prime-co  role=prop   strategy=momentum     cash=900000
group prop-brk    count=2  broker=prime-co  role=prop   strategy=breakout     cash=900000
group prop-rev    count=3  broker=prime-co  role=prop   strategy=meanrev      cash=900000

# Retail (retail broker): rule-based personas using stops, brackets, GTT and after-market orders
group daytrader   count=10 broker=retail-co role=retail strategy=daytrader    cash=40000
group swing       count=10 broker=retail-co role=retail strategy=swing        cash=60000
group investor    count=8  broker=retail-co role=retail strategy=investor     cash=90000
# ML personas: online logistic regression on returns, volatility, z-score and news sentiment; they learn
# from the tape before trading, then enter with brackets or GTT dips and exit when the model turns
group ml-cautious count=4  broker=retail-co role=retail strategy=ml-retail    cash=60000    style=cautious
group ml-bold     count=4  broker=retail-co role=retail strategy=ml-retail    cash=60000    style=bold
group noise       count=15 broker=retail-co role=retail strategy=noise        cash=30000    seed=5000
