# The simulated world, owned by ome-simctl. Companies evolve with earnings, company and sector events
# and the economy; simctl files each prospectus, opens the issuer account at the underwriter, lists the
# IPO and names the designated market maker through the exchange's and brokers' real interfaces.
# company <SYMBOL> sector=<name> price=<listing price> shares=<n> eps=<annual EPS> margin=<net margin %>
#         growth=<revenue growth %> beta=<sensitivity to the economy> underwriter=<broker> dmm=<member>
#         name=<full name, last>
company ACME sector=robotics price=25.00 shares=67000  eps=1.25 margin=12 growth=9  beta=1.2 underwriter=prime-co dmm=lp-co name=Acme Robotics
company NOVA sector=energy   price=12.50 shares=142000 eps=0.80 margin=8  growth=4  beta=0.9 underwriter=prime-co dmm=lp-co name=Nova Energy
company ZEN  sector=biotech  price=80.00 shares=21000  eps=2.50 margin=18 growth=15 beta=1.3 underwriter=prime-co dmm=lp-co name=Zen Biotech

# Demo accounts for people (agents come from config/roster.conf).
# account <login> broker=<broker> role=<role> cash=<amount> secret=<password>
account alice broker=retail-co role=retail cash=25000   secret=alice-pw
account bob   broker=retail-co role=retail cash=10000   secret=bob-pw
account fund  broker=prime-co  role=quant  cash=5000000 secret=fund-pw
