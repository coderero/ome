# Liquidity profiles: copy to config/profiles.conf (kept out of git) and fill in the symbols you care
# about from your own data. ome-simctl sizes each company from it (shares outstanding, starting price,
# free float); `ome exchange vol` prints the other numbers next to what the simulated market actually
# did. They are never fed back into the market: behaviour comes from the participants, not a target.
# profile <SYMBOL> shares=<outstanding> price=<start price> free-float=<% offered> adv=<shares per day>
#         spread-bps=<typical quoted spread> vol-pct=<typical daily move %> depth-1pct=<shares within 1% of mid>
profile ACME shares=1350000 price=25.00 free-float=55 adv=120000 spread-bps=8 vol-pct=1.8 depth-1pct=20000
