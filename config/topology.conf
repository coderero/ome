# OME topology for omectl: one service per line, `<kind> <name> port=<port> [options]`.
# omectl starts them in kind order (exchange, clearing, newsroom, venues, brokers, simctl, agents,
# recorder), supervises them and approves the applications of the participants declared here.
# Environment overrides: OME_HOST, OME_DATA, OME_REGIME, OME_TRADING_DAY, OME_WRITER, OME_RECORD.
set host=127.0.0.1 data=data registry=7600 regime=us writer=auto trading-day=5,45,5,5 collateral=2000000

exchange  exchange      port=7000 luld-bps=500
clearing  ccp           port=7200
newsroom  newsroom      port=7500

# off-exchange venues; collateral= registers the venue with the clearing house so its trades settle
venue     wholesale-co  port=7301 kind=wholesaler member=lp collateral=2000000
venue     ats-co        port=7302 kind=ats member=broker

# brokers and liquidity providers: each applies for exchange, clearing, venue and news membership
broker    retail-co     port=7101 profile=retail wholesaler=wholesale-co
broker    prime-co      port=7102 profile=prime ats=ats-co
broker    dma-co        port=7103 profile=dma
broker    lp-co         port=7104 profile=lp

# the simulation controller owns the world (companies, economy, events), seeding and the agent roster
simctl    simctl        port=7400 world=config/world.conf roster=config/roster.conf news-per-day=1 quarter-days=20
agents    agents        runners=1
recorder  recorder      when=record
